services:
  mysql:
    image: mysql:8.4
    container_name: myfirst-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: myfirst
      MYSQL_USER: myfirst
      MYSQL_PASSWORD: local_dev_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports: ["3307:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-plocal_root_password"]
      interval: 5s
      timeout: 5s
      retries: 20
  adminer:
    image: adminer:5
    container_name: myfirst-adminer
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    ports: ["8080:8080"]
volumes:
  mysql_data:
